[project]
name = "mini-agent"
version = "0.1.0"
description = "Un agent de code minimal autour d'Ollama, écrit à la main pour comprendre chaque brique."
readme = "README.md"
authors = [{ name = "Nils Malmberg" }]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
mini-agent = "mini_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]